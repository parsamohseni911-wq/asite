
{% extends 'base.html' %}
{% load static %}

{% block title %}
تغییر رمز عبور
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-5 col-md-7 col-sm-10">

            <div class="auth-card">

                <div class="auth-header">

                    <div class="auth-logo">
                        🔐
                    </div>

                    <h2>
                        تغییر رمز عبور
                    </h2>

                    <p>
                        رمز عبور جدید خود را وارد کنید.
                    </p>

                </div>


                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }} auth-alert">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}


                <form method="post">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            رمز عبور جدید
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control auth-input"
                            placeholder="حداقل ۸ کاراکتر"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            تکرار رمز عبور
                        </label>

                        <input
                            type="password"
                            name="password_confirm"
                            id="password_confirm"
                            class="form-control auth-input"
                            placeholder="رمز عبور را دوباره وارد کنید"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-warning w-100 auth-button">

                        تغییر رمز عبور

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<style>

.auth-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 40px;

    box-shadow:
        0 15px 45px rgba(0, 0, 0, .08);

    transition: .3s ease;
}

.auth-card:hover {
    transform: translateY(-4px);
}

.auth-header {
    text-align: center;
    margin-bottom: 30px;
}

.auth-logo {
    width: 85px;
    height: 85px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 42px;

    background: #fff3cd;

    border-radius: 18px;
}

.auth-header h2 {
    font-weight: 800;
    margin-bottom: 10px;
}

.auth-header p {
    color: #777;
}

.auth-alert {
    border-radius: 12px;
}

.auth-input {
    height: 58px;

    border-radius: 14px;

    padding: 0 18px;

    transition: .25s;
}

.auth-input:focus {
    border-color: #ffc107;

    box-shadow:
        0 0 0 4px rgba(255, 193, 7, .15);
}

.auth-button {
    height: 58px;

    border-radius: 14px;

    font-size: 17px;
    font-weight: 700;

    transition: .3s;
}

.auth-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 25px rgba(255, 193, 7, .3);
}

@media (max-width: 576px) {

    .auth-card {
        padding: 28px 20px;
    }

}

</style>

{% endblock %}
