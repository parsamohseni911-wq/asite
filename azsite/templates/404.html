

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        Tahoma,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(249, 115, 22, 0.10),
            transparent 35%
        ),
        #050505;

    color: #fff;

    overflow-x: hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;

    position: relative;
    overflow: hidden;
}


/* =========================================================
   BACKGROUND GRID
   ========================================================= */

.page::before {
    content: "";

    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,0.025) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 25%,
            black 75%,
            transparent
        );

    pointer-events: none;
}


/* =========================================================
   GLOW
   ========================================================= */

.glow {
    position: absolute;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    filter: blur(100px);

    opacity: 0.15;

    pointer-events: none;
}

.glow-one {
    background: #f97316;

    top: 5%;
    right: 5%;
}

.glow-two {
    background: #ea580c;

    bottom: 5%;
    left: 5%;
}


/* =========================================================
   ERROR BOX
   ========================================================= */

.error-box {
    width: min(760px, 100%);

    position: relative;

    text-align: center;

    padding: 55px 35px;

    border: 1px solid rgba(249, 115, 22, 0.18);

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.045),
            rgba(255,255,255,0.015)
        );

    box-shadow:
        0 30px 100px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.04);

    backdrop-filter: blur(15px);

    animation: boxIn 0.7s ease both;
}


/* =========================================================
   404 NUMBER
   ========================================================= */

.error-code {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 8px;

    font-size: clamp(110px, 22vw, 220px);

    line-height: 0.85;

    font-weight: 900;

    letter-spacing: -12px;

    color: #f97316;

    text-shadow:
        0 0 25px rgba(249,115,22,0.35),
        0 0 70px rgba(249,115,22,0.15);
}


/* =========================================================
   ZERO
   ========================================================= */

.zero {
    width: clamp(80px, 16vw, 160px);
    height: clamp(80px, 16vw, 160px);

    border-radius: 50%;

    border: clamp(14px, 2.5vw, 24px) solid #f97316;

    position: relative;

    transform: rotate(-8deg);

    box-shadow:
        0 0 25px rgba(249,115,22,0.3),
        inset 0 0 25px rgba(249,115,22,0.08);
}

.zero-inner {
    position: absolute;

    width: 35%;
    height: 35%;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: #080808;

    box-shadow:
        inset 0 0 15px rgba(249,115,22,0.15);
}


/* =========================================================
   LINE
   ========================================================= */

.line {
    width: 80px;
    height: 3px;

    margin: 35px auto 25px;

    border-radius: 50px;

    background: #f97316;

    box-shadow:
        0 0 15px rgba(249,115,22,0.5);
}


/* =========================================================
   TITLE
   ========================================================= */

h1 {
    font-size: clamp(25px, 4vw, 38px);

    font-weight: 800;

    margin-bottom: 15px;

    color: #fff;
}


/* =========================================================
   DESCRIPTION
   ========================================================= */

.error-box p {
    max-width: 570px;

    margin: 0 auto;

    color: #a3a3a3;

    font-size: 16px;

    line-height: 2;

}


/* =========================================================
   BUTTONS
   ========================================================= */

.buttons {
    display: flex;

    justify-content: center;

    gap: 14px;

    margin-top: 32px;

    flex-wrap: wrap;
}

.btn {
    min-width: 170px;

    height: 52px;

    padding: 0 24px;

    border-radius: 13px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    text-decoration: none;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

.btn span {
    font-size: 19px;
}


/* PRIMARY */

.btn.primary {
    background: #f97316;

    color: #fff;

    box-shadow:
        0 10px 30px rgba(249,115,22,0.2);
}

.btn.primary:hover {
    transform: translateY(-3px);

    background: #fb923c;

    box-shadow:
        0 15px 40px rgba(249,115,22,0.35);
}


/* SECONDARY */

.btn.secondary {
    border: 1px solid rgba(255,255,255,0.1);

    background: rgba(255,255,255,0.04);

    color: #ddd;
}

.btn.secondary:hover {
    transform: translateY(-3px);

    border-color: rgba(249,115,22,0.4);

    color: #f97316;

    background: rgba(249,115,22,0.06);
}


/* =========================================================
   ERROR INFO
   ========================================================= */

.error-info {
    margin-top: 35px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    font-size: 11px;

    color: #555;

    letter-spacing: 2px;
}

.error-info strong {
    color: #f97316;
}


/* =========================================================
   ANIMATION
   ========================================================= */

@keyframes boxIn {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .page {
        padding: 18px;
    }

    .error-box {
        padding: 40px 20px;

        border-radius: 22px;
    }

    .error-code {
        letter-spacing: -7px;
    }

    .error-box p {
        font-size: 14px;

        line-height: 1.9;
    }

    .buttons {
        flex-direction: column;

        width: 100%;
    }

    .btn {
        width: 100%;
    }

    .glow {
        width: 220px;
        height: 220px;

        filter: blur(75px);
    }

}


/* =========================================================
   SMALL MOBILE
   ========================================================= */

@media (max-width: 380px) {

    .error-box {
        padding: 32px 16px;
    }

    .error-code {
        font-size: 100px;
    }

    .zero {
        width: 76px;
        height: 76px;
    }

    h1 {
        font-size: 23px;
    }

}
</style>
{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 | صفحه پیدا نشد</title>

    <link rel="stylesheet" href="{% static 'css/404.css' %}">
</head>

<body>

<div class="page">

    <!-- Glow Background -->
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <main class="error-box">

        <div class="error-code">
            <span>4</span>
            <div class="zero">
                <div class="zero-inner"></div>
            </div>
            <span>4</span>
        </div>

        <div class="line"></div>

        <h1>
            صفحه پیدا نشد
        </h1>

        <p>
            متأسفانه صفحه‌ای که دنبال آن هستید وجود ندارد
            یا ممکن است آدرس آن تغییر کرده باشد.
        </p>

        <div class="buttons">

            <a href="/" class="btn primary">
                <span>⌂</span>
                بازگشت به خانه
            </a>

            <button
                type="button"
                class="btn secondary"
                onclick="history.back()"
            >
                <span>←</span>
                صفحه قبل
            </button>

        </div>

        <div class="error-info">
            <span>ERROR</span>

        </div>

    </main>

</div>

</body>
</html>
