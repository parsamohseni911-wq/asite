
{% load static %}

<!DOCTYPE html><html dir="rtl" lang="fa"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ورود | ثبت نام</title>

<link rel="stylesheet"
      href="{% static 'css/vendors/bootstrap/bootstrap.rtl.css' %}">

<link rel="stylesheet"
      href="{% static 'css/vendors/fontawesome/fontawesome.min.css' %}">

<link rel="stylesheet"
      href="{% static 'css/style.css' %}">

<style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #050505;
        color: #fff;
        overflow-x: hidden;
    }


    /* =====================================================
       MAIN BACKGROUND
    ===================================================== */

    .login-page {
        position: relative;
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
            radial-gradient(
                circle at 15% 20%,
                rgba(255, 115, 0, .12),
                transparent 30%
            ),
            radial-gradient(
                circle at 85% 80%,
                rgba(255, 145, 0, .10),
                transparent 30%
            ),
            #050505;
    }


    /* =====================================================
       BACKGROUND LIGHTS
    ===================================================== */

    .light {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        pointer-events: none;
        opacity: .55;
        animation: floatingLight 8s ease-in-out infinite alternate;
    }

    .light-1 {
        width: 260px;
        height: 260px;
        background: rgba(255, 102, 0, .24);
        top: -100px;
        right: -70px;
    }

    .light-2 {
        width: 220px;
        height: 220px;
        background: rgba(255, 174, 0, .15);
        bottom: -90px;
        left: -70px;
        animation-delay: 2s;
    }

    .light-3 {
        width: 140px;
        height: 140px;
        background: rgba(255, 120, 0, .12);
        top: 45%;
        left: 42%;
        animation-delay: 4s;
    }

    @keyframes floatingLight {

        from {
            transform: translate(0, 0) scale(1);
        }

        to {
            transform: translate(35px, -25px) scale(1.15);
        }
    }


    /* =====================================================
       GRID
    ===================================================== */

    .login-grid {
        position: absolute;
        inset: 0;

        background-image:
            linear-gradient(
                rgba(255, 255, 255, .018) 1px,
                transparent 1px
            ),
            linear-gradient(
                90deg,
                rgba(255, 255, 255, .018) 1px,
                transparent 1px
            );

        background-size: 45px 45px;

        mask-image: linear-gradient(
            to bottom,
            transparent,
            black 20%,
            black 80%,
            transparent
        );

        pointer-events: none;
    }


    /* =====================================================
       MAIN CARD
    ===================================================== */

    .login-card {
        position: relative;
        z-index: 5;

        width: min(1100px, calc(100% - 30px));
        min-height: 650px;

        display: grid;
        grid-template-columns: 1fr 1fr;

        overflow: hidden;

        border: 1px solid rgba(255, 132, 0, .18);

        border-radius: 30px;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,.065),
                rgba(255,255,255,.018)
            );

        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);

        


box-shadow:
            0 30px 100px rgba(0,0,0,.65),
            0 0 70px rgba(255,102,0,.07);

        animation: cardAppear .8s ease both;
    }

    @keyframes cardAppear {

        from {
            opacity: 0;
            transform: translateY(25px) scale(.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }


    /* =====================================================
       FORM SIDE
    ===================================================== */

    .login-form-side {
        position: relative;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 55px 60px;

        background:
            linear-gradient(
                135deg,
                rgba(10,10,10,.97),
                rgba(20,15,10,.92)
            );
    }


    /* =====================================================
       ORANGE GLOW
    ===================================================== */

    .form-glow {
        position: absolute;

        width: 300px;
        height: 300px;

        background: rgba(255, 111, 0, .10);

        filter: blur(90px);

        top: -150px;
        right: -130px;

        pointer-events: none;
    }


    /* =====================================================
       FORM
    ===================================================== */

    .login-form {
        position: relative;
        z-index: 2;

        width: 100%;
        max-width: 430px;
    }


    /* =====================================================
       TITLE
    ===================================================== */

    .brand-icon {
        width: 62px;
        height: 62px;

        margin: 0 auto 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 20px;

        color: #ff8a00;

        font-size: 25px;

        background:
            linear-gradient(
                145deg,
                rgba(255,140,0,.16),
                rgba(255,100,0,.04)
            );

        border: 1px solid rgba(255,140,0,.25);

        box-shadow:
            0 0 35px rgba(255,110,0,.12);

        transition: .3s ease;
    }

    .brand-icon:hover {
        transform: translateY(-4px) rotate(-3deg);

        box-shadow:
            0 0 45px rgba(255,110,0,.28);
    }

    .login-title {
        margin: 0;

        color: #fff;

        font-size: clamp(25px, 4vw, 34px);

        font-weight: 800;
    }

    .login-subtitle {
        margin: 10px 0 35px;

        color: #929292;

        font-size: 13px;
    }


    /* =====================================================
       INPUT
    ===================================================== */

    .input-group-custom {
        position: relative;

        width: 100%;

        margin-bottom: 20px;
    }

    .input-group-custom input {
        width: 100%;
        height: 58px;

        padding: 0 18px;

        border-radius: 15px;

        outline: none;

        color: #fff;

        background: rgba(255,255,255,.035);

        border: 1px solid rgba(255,255,255,.09);

        font-size: 14px;

        transition:
            border-color .25s ease,
            box-shadow .25s ease,
            background .25s ease;
    }

    .input-group-custom input:hover {
        border-color: rgba(255,140,0,.35);
    }

    .input-group-custom input:focus {
        background: rgba(255,110,0,.045);

        border-color: #ff8500;

        box-shadow:
            0 0 0 4px rgba(255,120,0,.08),
            0 0 25px rgba(255,110,0,.08);
    }

    .input-group-custom label {
        position: absolute;

        right: 17px;
        top: 50%;

        transform: translateY(-50%);

        padding: 0 7px;

        color: #858585;

        font-size: 12px;

        pointer-events: none;

        background: #100e0c;

        transition:
            top .2s ease,
            color .2s ease,
            font-size .2s ease;
    }

    .input-group-custom input:focus + label,
    .input-group-custom input:not(:placeholder-shown) + label {
    


    top: 0;

        color: #ff8a00;

        font-size: 10px;
    }


    /* =====================================================
       BUTTON
    ===================================================== */

    .btn-auth {
        position: relative;

        height: 58px;

        margin-top: 8px;

        border: 0;

        border-radius: 15px;

        color: #fff;

        background:
            linear-gradient(
                135deg,
                #ff9700,
                #e85d00
            );

        font-size: 14px;

        cursor: pointer;

        overflow: hidden;

        box-shadow:
            0 10px 30px rgba(255,100,0,.18);

        transition:
            transform .25s ease,
            box-shadow .25s ease;
    }

    .btn-auth::before {
        content: "";

        position: absolute;

        top: 0;
        left: -100%;

        width: 70%;
        height: 100%;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.25),
                transparent
            );

        transform: skewX(-20deg);

        transition: .6s ease;
    }

    .btn-auth:hover::before {
        left: 130%;
    }

    .btn-auth:hover {
        transform: translateY(-2px);

        box-shadow:
            0 14px 35px rgba(255,100,0,.30);
    }

    .btn-auth:active {
        transform: translateY(0);
    }


    /* =====================================================
       TERMS
    ===================================================== */

    .terms {
        margin-top: 22px;

        color: #707070;

        font-size: 10px;

        line-height: 1.9;
    }

    .terms span {
        color: #ff8a00;
    }


    /* =====================================================
       IMAGE SIDE
    ===================================================== */

    .login-visual {
        position: relative;

        min-height: 650px;

        overflow: hidden;

        background:
            linear-gradient(
                135deg,
                rgba(255,91,0,.12),
                rgba(0,0,0,.65)
            );
    }

    .login-visual::after {
        content: "";

        position: absolute;
        inset: 0;

        background:
            linear-gradient(
                90deg,
                #0a0908 0%,
                transparent 50%
            );

        pointer-events: none;
    }

    .login-visual img {
        width: 100%;
        height: 100%;

        object-fit: cover;

        opacity: .7;

        filter:
            saturate(.8)
            contrast(1.08);

        transition:
            transform 8s ease;
    }

    .login-card:hover .login-visual img {
        transform: scale(1.05);
    }


    /* =====================================================
       VISUAL CONTENT
    ===================================================== */

    .visual-content {
        position: absolute;

        z-index: 3;

        right: 45px;
        bottom: 45px;
        left: 45px;
    }

    .visual-badge {
        display: inline-flex;

        align-items: center;
        gap: 8px;

        padding: 8px 13px;

        margin-bottom: 15px;

        border-radius: 50px;

        color: #ff9a28;

        background: rgba(255,130,0,.10);

        border: 1px solid rgba(255,130,0,.18);

        font-size: 10px;
    }

    .visual-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: #ff8500;

        box-shadow:
            0 0 12px #ff8500;
    }

    .visual-title {
        margin: 0 0 10px;

        color: #fff;

        font-size: clamp(25px, 4vw, 40px);

        font-weight: 800;

        line-height: 1.3;
    }

    .visual-text {
        max-width: 390px;

        margin: 0;

        color: rgba(255,255,255,.65);

        font-size: 12px;

        line-height: 2;
    }


    /* =====================================================
       RESPONSIVE
    ===================================================== */

    @media (max-width: 991.98px) {

        .login-card {
            width: m


in(650px, calc(100% - 25px));

            grid-template-columns: 1fr;

            min-height: auto;
        }

        .login-visual {
            display: none;
        }

        .login-form-side {
            min-height: 650px;

            padding: 50px 40px;
        }
    }


    @media (max-width: 575.98px) {

        .login-page {
            padding: 20px 0;
        }

        .login-card {
            width: calc(100% - 24px);

            border-radius: 23px;
        }

        .login-form-side {
            min-height: auto;

            padding: 40px 20px;
        }

        .login-title {
            font-size: 25px;
        }

        .login-subtitle {
            margin-bottom: 28px;
        }

        .input-group-custom input {
            height: 55px;
        }

        .btn-auth {
            height: 55px;
        }

        .light-1 {
            width: 180px;
            height: 180px;
        }

        .light-2 {
            width: 160px;
            height: 160px;
        }
    }


    @media (max-width: 380px) {

        .login-form-side {
            padding: 35px 15px;
        }

        .login-card {
            width: calc(100% - 16px);
        }

        .brand-icon {
            width: 55px;
            height: 55px;
        }

        .input-group-custom {
            margin-bottom: 16px;
        }
    }

</style>

</head><body><div class="login-page"><!-- نورهای پس‌زمینه -->

<div class="light light-1"></div>
<div class="light light-2"></div>
<div class="light light-3"></div>

<div class="login-grid"></div>


<!-- =====================================================
     MAIN CARD
====================================================== -->

<div class="login-card">


    <!-- =================================================
         FORM
    ================================================== -->

    <div class="login-form-side">

        <div class="form-glow"></div>

        <div class="login-form">

            <div class="brand-icon">
                <i class="fa fa-user"></i>
            </div>

            <h1 class="login-title">
                ورود | ثبت نام
            </h1>

            <p class="login-subtitle">
                اطلاعات حساب خود را تکمیل کنید
            </p>


            <!-- =================================================
                 FORM — قابلیت و لینک اصلی حفظ شده
            ================================================== -->

            <form
                class="mb-3"
                method="post"
                action="{% url 'accounts:complete' %}"
            >

                {% csrf_token %}

                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >


                <!-- شماره موبایل -->

                <div class="input-group-custom">

                    <input
                        name="number"
                        type="text"
                        id="number"
                        placeholder=" "
                        required
                        autocomplete="tel"
                    >

                    <label for="number">
                        شماره موبایل
                    </label>

                </div>


                <!-- نشانی -->

                <div class="input-group-custom">

                    <input
                        name="adress"
                        type="text"
                        id="adress"
                        placeholder=" "
                        required
                        autocomplete="street-address"
                    >

                    <label for="adress">
                        نشانی
                    </label>

                </div>


                <!-- کد پستی -->

                <div class="input-group-custom">

                    <input
                        name="postcode"
                        type="text"
                        id="postcode"
                        placeholder=" "
                        required
                        i
                        autocomplete="postal-code"
                    >

                    <label for="postcode">
                        کد پستی
                    </label>

                </div>


                <!-- ذخیره -->

                <button
                    type="submit"
                    class="btn-auth w-100 fw-bold"
                >

                    <i class="fa fa-check-circle ms-1"></i>

                    ذخیره

                </button>

            </form>


            <div class="terms">

                ورود شما به معنای پذیرش
                <span>شرایط و قوانین</span>
                است.

            </div>

        </div>

    </div>


    <!-- =================================================
         VISUAL
    ================================================== -->

    <div class="login-visual">

        <img
            src="{% static 'img/station.svg' %}"
            alt="background"
        >


        <div class="visual-content">

            <div class="visual-badge">

                <span class="visual-dot"></span>

                حساب کاربری

            </div>


            <h2 class="visual-title">
                حساب خود را<br>
                تکمیل کنید
            </h2>


            <p class="visual-text">
                اطلاعات خود را وارد کنید تا بتوانید
                از امکانات حساب کاربری استفاده کنید.
            </p>

        </div>

    </div>

</div>

</div><!-- =====================================================
     INTERACTION
====================================================== --><script>

document.addEventListener("DOMContentLoaded", function () {

    const inputs =
        document.querySelectorAll(
            ".input-group-custom input"
        );


    inputs.forEach(function (input) {

        input.addEventListener("focus", function () {

            this.parentElement.classList.add("focused");

        });


        input.addEventListener("blur", function () {

            this.parentElement.classList.remove("focused");

        });

    });


    /*
     * جلوگیری از ثبت اشتباه کد پستی
     * فقط عدد
     */

    const postcode =
        document.getElementById("postcode");

    if (postcode) {

        postcode.addEventListener("input", function () {

            this.value =
                this.value.replace(/\D/g, "");

        });

    }


    /*
     * افکت حرکت بسیار ظریف کارت با موس
     * فقط روی دسکتاپ
     */

    const card =
        document.querySelector(".login-card");

    if (
        card &&
        window.matchMedia("(min-width: 992px)").matches
    ) {

        card.addEventListener("mousemove", function (e) {

            const rect =
                card.getBoundingClientRect();

            const x =
                (e.clientX - rect.left) / rect.width - .5;

            const y =
                (e.clientY - rect.top) / rect.height - .5;

            card.style.transform =
                `perspective(1200px)
                 rotateY(${x * 1.2}deg)
                 rotateX(${y * -1.2}deg)`;

        });


        card.addEventListener("mouseleave", function () {

            card.style.transform =
                "perspective(1200px) rotateY(0) rotateX(0)";

        });

    }

});

</script></body>
</html>
