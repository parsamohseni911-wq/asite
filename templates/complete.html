<body class="body-login">
<div class="login-wrapper d-flex justify-content-center align-content-center flex-row w-100 vh-100">
    <!-- ستون فرم -->
    <div class="col-md-6 col-12 d-flex h-100 bg-white align-items-center justify-content-center p-4">
        <div class="login-form text-center">

            <h1 class="fw-bold fs-3 mb-3">ورود | ثبت نام</h1>
            <p class="text-start">سلام!</p>
            <p class="text-start"></p>
<form class="mb-3"
      method="post"
      action="{% url 'accounts:complete' %}">

    {% csrf_token %}

    <input type="hidden"
           name="next"
           value="{{ next }}">

    <div class="input-group">
        <input name="number"
               type="text"
               id="number"
               placeholder=" "
               required>

        <label for="number">
            شماره موبایل
        </label>
    </div>

    <div class="input-group">
        <input name="adress"
               type="text"
               id="adress"
               placeholder=" "
               required>

        <label for="adress">
            نشانی
        </label>
    </div>

    <div class="input-group">
        <input name="postcode"
               type="text"
               id="postcode"
               placeholder=" "
               required>

        <label for="postcode">
            کد پستی
        </label>
    </div>

    <button type="submit"
            class="btn-auth w-100 fw-bold">
        ذخیره
    </button>

</form>
