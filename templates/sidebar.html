<style>

/* =========================================================
   USER SIDEBAR
========================================================= */

.user-panel-aside {
    direction: rtl;
    width: 100%;
    background: #ffffff;
    border-color: #e8ebef !important;
    border-radius: 20px !important;
    overflow: hidden;

    box-shadow:
        0 7px 25px rgba(0, 0, 0, 0.035);

    transition: box-shadow .25s ease;
}

.user-panel-aside:hover {
    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.055);
}


/* =========================================================
   HEADER
========================================================= */

.user-panel-aside-header {
    padding: 22px 18px 20px;
    border-bottom: 1px solid #f0f1f3;
}


/* =========================================================
   AVATAR
========================================================= */

.user-avatar {
    width: 68px;
    height: 68px;

    margin: 0 auto 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #fff7e8;
    color: #d97706;

    font-size: 35px;

    border: 1px solid #f6dfb7;
}


/* =========================================================
   USER NAME
========================================================= */

.user-name-row {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;
    margin-bottom: 5px;
}

.user-name {
    max-width: 190px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    color: #252a30;

    font-size: 14px;
    font-weight: 700;
}


/* =========================================================
   EDIT PROFILE
========================================================= */

.user-edit-link {
    width: 27px;
    height: 27px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 8px;

    color: #8d949c;

    text-decoration: none;

    transition:
        background .2s ease,
        color .2s ease;
}

.user-edit-link:hover {
    background: #fff7e8;
    color: #d97706;
}


/* =========================================================
   PHONE
========================================================= */

.user-phone {
    color: #9aa0a7;
    font-size: 11px;
}


/* =========================================================
   MENU
========================================================= */

.user-panel-aside-menu {
    padding: 13px 10px;
}

.menu-list {
    list-style: none;
    margin: 0;
    padding: 0;
}


/* =========================================================
   MENU ITEM
========================================================= */

.menu-item {
    width: 100%;
    margin-bottom: 5px;
}

.menu-item:last-child {
    margin-bottom: 0;
}


/* =========================================================
   MENU LINK
========================================================= */

.menu-link {
    position: relative;

    width: 100%;
    min-height: 48px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 8px 13px;

    box-sizing: border-box;

    border-radius: 12px;

    color: #4c535b;

    background: transparent;

    text-decoration: none !important;

    font-size: 12px;
    font-weight: 500;

    transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
}


/* =========================================================
   ICON
========================================================= */

.icon-wrap {
    width: 34px;
    height: 34px;

    flex: 0 0 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #737a82;

    border-radius: 9px;

    transition:
        background .2s ease,
        color .2s ease;
}

.icon-wrap svg {
    display: block;

    width: 20px;
    height: 20px;
}

.icon-wrap i {
    font-size: 16px;
}


/* =========================================================
   TEXT
========================================================= */

.menu-text {
    color: #4c535b;

    transition: color .2s ease;
}


/* =========================================================
   NORMAL HOVER
========================================================= */

.menu-item:not(.active) .menu-link:hover {
    background: #fffaf3;

    color: #d97706;

    transform: translateX(-3px);
}

.menu-item:not(.active) .menu-link:hover .icon-wrap {
    background: #fff1dc;
    color: #d97706;
}

.menu-item:not(.active) .menu-link:hover .menu-text {
    color: #d97706;
}


/* =========================================================
   ACTIVE
   فقط اطلاعات حساب کاربری
========================================================= */

.menu-item.active .menu-link {
    background: #fff7e8 !important;

    color: #d97706 !important;

    box-shadow:
        inset 0 0 0 1px rgba(217, 119, 6, 0.05);
}

.menu-item.active .icon-wrap {
    background: #fff0d8 !important;
    color: #d97706 !important;
}

.menu-item.active .menu-text {
    color: #d97706 !important;
    font-weight: 700;
}

.menu-item.active .menu-link:hover {
    background: #fff3df !important;
    transform: translateX(-2px);
}


/* =========================================================
   LOGOUT
========================================================= */

.menu-item.logout {
    margin-top: 8px;

    padding-top: 8px;

    border-top: 1px solid #f0f1f3;
}

.menu-item.logout .menu-link {
    color: #707780;
}

.menu-item.logout .menu-text {
    color: #707780;
}

.menu-item.logout .icon-wrap {
    color: #777e86;
}

.menu-item.logout .menu-link:hover {
    background: #fff4f4 !important;
    color: #dc3545 !important;
}

.menu-item.logout .menu-link:hover .icon-wrap {
    background: #ffe8e8;
    color: #dc3545;
}

.menu-item.logout .menu-link:hover .menu-text {
    color: #dc3545;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 991.98px) {

    .user-panel-aside {
        margin-bottom: 20px;
    }

}


@media (max-width: 575.98px) {

    .user-panel-aside {
        border-radius: 17px !important;
    }

    .user-panel-aside-header {
        padding: 18px 15px;
    }

    .user-avatar {
        width: 60px;
        height: 60px;

        font-size: 30px;
    }

    .user-panel-aside-menu {
        padding: 10px 8px;
    }

    .menu-link {
        min-height: 46px;
        padding: 7px 11px;
    }

    .menu-text {
        font-size: 12px;
    }

}

</style>


<!-- =========================================================
     USER PANEL
========================================================= -->

<div class="col-sm-12 col-md-12 col-lg-4 col-xl-3">

    <aside
        class="user-panel-aside border border-radius-3xl py-3"

                    aria-label="ویرایش اطلاعات"
                    title="ویرایش اطلاعات"
                >

                    <i
                        class="fa fa-pen"
                        aria-hidden="true"
                    ></i>

                </a>

            </div>


            <!-- Phone -->

            <div class="user-phone">

                <!-- =================================================

                ================================================== -->

                <li

                    role="menuitem"
                >

                    <a

                <!-- =================================================
                     LOGOUT
                ================================================== -->

                <li
                    class="menu-item logout"
                    role="menuitem"
                >

                    <a
                        href="{% url 'accounts:logout_user' %}"
                        class="menu-link"
                        title="خروج"
                    >

                        <span class="icon-wrap">

                            <i
                                class="fa fa-sign-out-alt"
                                aria-hidden="true"
                            ></i>

                        </span>


                        <span class="menu-text">
                            خروج
                        </span>

                    </a>

                </li>


            </ul>

        </div>

    </aside>

</div>
